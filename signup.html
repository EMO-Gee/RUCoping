<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - RuCOPING</title>
    <style>
        body {
            background-color: #F1E3F3;
            color: #484041;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-box {
            text-align: center;
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 420px;
        }

        h3 {
            color: #792EB2;
            margin-top: 0;
        }

        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 8px;
            margin: 8px 0 14px 0;
            border: 1px solid rgba(72,64,65,0.15);
            border-radius: 4px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            background-color: #2B6CB0;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #792EB2;
            text-decoration: none;
        }
    </style>
</head>
<body>


<div class="login-box">
        <h3>Create an Account</h3>
        <form><!-- action="signup.php" method="POST"-->
            <img src="Resources/LoginImg.png" alt="Login Image" width="200" height="200" >
            </br>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" minlength="6" required><br><br>

            <label for="confirm">Confirm Password:</label><br>
            <input type="password" id="confirm" name="confirm" minlength="6" required><br><br>

            <button type="submit">Sign Up</button>

            <p>Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

</body>
</html>
